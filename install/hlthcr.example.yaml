### Hlthcr (occupational health CRM): install config for "php hubleto init", Hubleto 2.
### Copy to the root of a new Hubleto project as hlthcr.yaml, fill in the URL, DB and admin values, then:
###   php hubleto prepare-composer hlthcr.yaml && composer update   (once: adds the Hlthcr packages)
###   php hubleto init hlthcr.yaml   (DESTRUCTIVE: drops and recreates the database)
### Re-init: delete ConfigEnv.php first (init refuses to run otherwise). Full steps: install/README.md.

### Hlthcr packages, merged into the project's composer.json by "php hubleto prepare-composer".
### Run it only once: a second run doubles the entries and breaks composer.json.
### "no-api" makes composer clone with plain git, without GitHub API calls (no token, no API rate limit).
composer:
  repositories:
    wai-blue/hubleto-hlthcr-core: { type: vcs, url: 'https://github.com/JakubKrc/hubleto-hlthcr-core', no-api: true }
    wai-blue/hubleto-hlthcr-clients: { type: vcs, url: 'https://github.com/JakubKrc/hubleto-hlthcr-clients', no-api: true }
    wai-blue/hubleto-hlthcr-branches: { type: vcs, url: 'https://github.com/JakubKrc/hubleto-hlthcr-branches', no-api: true }
    wai-blue/hubleto-hlthcr-employees: { type: vcs, url: 'https://github.com/JakubKrc/hubleto-hlthcr-employees', no-api: true }
    wai-blue/hubleto-hlthcr-medical-exams: { type: vcs, url: 'https://github.com/JakubKrc/hubleto-hlthcr-medical-exams', no-api: true }
    wai-blue/hubleto-hlthcr-audits: { type: vcs, url: 'https://github.com/JakubKrc/hubleto-hlthcr-audits', no-api: true }
    wai-blue/hubleto-hlthcr-documents: { type: vcs, url: 'https://github.com/JakubKrc/hubleto-hlthcr-documents', no-api: true }
    wai-blue/hubleto-hlthcr-events: { type: vcs, url: 'https://github.com/JakubKrc/hubleto-hlthcr-events', no-api: true }
  require:
    wai-blue/hubleto-hlthcr-core: dev-main
    wai-blue/hubleto-hlthcr-clients: dev-main
    wai-blue/hubleto-hlthcr-branches: dev-main
    wai-blue/hubleto-hlthcr-employees: dev-main
    wai-blue/hubleto-hlthcr-medical-exams: dev-main
    wai-blue/hubleto-hlthcr-audits: dev-main
    wai-blue/hubleto-hlthcr-documents: dev-main
    wai-blue/hubleto-hlthcr-events: dev-main

### Project location
rewriteBase: /my-project/
# URLs must be written as https://host/{{ rewriteBase }} (rewriteBase is inserted without slashes).
projectUrl: http://localhost/{{ rewriteBase }}
srcUrl: http://localhost/{{ rewriteBase }}/vendor/hubleto/erp
assetsUrl: http://localhost/{{ rewriteBase }}/vendor/hubleto/assets

### Database connection
dbHost: localhost
dbUser: hubleto
dbPassword: CHANGE-ME
dbName: hbl_hlthcr
dbCodepage: utf8mb4

### Initial account access
accountFullName: Hlthcr
adminName: Admin
adminFamilyName: Hlthcr
adminNick: admin
adminEmail: admin@example.com
adminPassword: CHANGE-ME
language: sk

# crm is always installed (Customers, Contacts, Calendar, Documents, Mail, Notifications, ...)
packagesToInstall: crm,maintenance,help

### Miscellaneous
# true: FAKE demo data of Hubleto and of the Hlthcr apps (demo users: install/README.md)
generateDemoData: false
noPrompt: true

### Apps to be installed on top of the packages. Order matters: each app needs the ones above it.
appsToInstall:
  # Needed: community Customers, Calendar and Tasks read the leads, deals and projects tables.
  Hubleto\App\Community\Leads: []
  Hubleto\App\Community\Deals: []
  Hubleto\App\Community\Projects: []
  # Hlthcr apps (composer packages wai-blue/hubleto-hlthcr-*).
  Hubleto\App\External\WaiBlue\HlthcrCore: []
  Hubleto\App\External\WaiBlue\HlthcrClients: []
  Hubleto\App\External\WaiBlue\HlthcrBranches: []
  Hubleto\App\External\WaiBlue\HlthcrEmployees: []
  Hubleto\App\External\WaiBlue\HlthcrMedicalExams: []
  Hubleto\App\External\WaiBlue\HlthcrAudits: []
  Hubleto\App\External\WaiBlue\HlthcrDocuments: []
  Hubleto\App\External\WaiBlue\HlthcrEvents: []
